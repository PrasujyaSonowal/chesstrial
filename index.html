<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>ChessStake Prototype</title>
  <link rel="stylesheet" href="style.css" />

  <!-- chessboard + chess engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.13.4/chess.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboardjs/1.0.0/chessboard-1.0.0.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboardjs/1.0.0/chessboard-1.0.0.min.css">
</head>

<body>

<div id="login-screen" class="screen">
  <h1>♟ ChessStake</h1>
  <p>Enter username to continue</p>
  <input id="usernameInput" placeholder="Username" />
  <button onclick="login()">Continue</button>
</div>

<div id="main-screen" class="screen hidden">
  <header>
    <h2>Welcome, <span id="usernameDisplay"></span></h2>
    <div class="stats">
      <p>ELO: <span id="eloDisplay">1200</span></p>
      <p>Balance: <span id="walletDisplay">500</span> credits</p>
    </div>
  </header>

  <section>
    <h3>Create Match</h3>
    <input type="number" id="stakeAmount" min="10" step="10" placeholder="Stake Amount (min 10)">
    <button onclick="createMatch()">Create</button>
  </section>

  <section>
    <h3>Active Matches</h3>
    <div id="matchList"></div>
  </section>
</div>


<div id="game-screen" class="screen hidden">
  <h2>Match: <span id="matchIdDisplay"></span></h2>
  <p>Stake per player: <span id="stakeDisplay"></span> → Winner earns <b id="prizeDisplay"></b></p>

  <div id="board" style="width: 380px"></div>
  <p id="status"></p>

  <button onclick="exitGame()">Exit</button>
</div>

<script src="script.js"></script>
</body>
</html>
